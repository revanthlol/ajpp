<!DOCTYPE html>
<html>
<body>
    <h2>Arithmetic Calculator</h2>
    <form action="calc" method="post">
        Num 1: <input type="number" name="num1" required><br><br>
        Num 2: <input type="number" name="num2" required><br><br>
        Operation:
        <select name="op">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select><br><br>
        <input type="submit" value="Calculate">
    </form>
</body>
</html>
