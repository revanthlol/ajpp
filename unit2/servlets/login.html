<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .login-box { width: 320px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        input[type=text], input[type=password] { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        input[type=submit] { width: 100%; background-color: #007BFF; color: white; padding: 10px; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>User Login</h2>
        <form action="login" method="post">
            <label>Username:</label>
            <input type="text" name="username" placeholder="Enter username" required>

            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter password" required>

            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
